<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="Styles.css">
</head>

<body class="signup-body" style="margin: 0; padding: 0; overflow: hidden;">

<section>
  <div class="wave">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="content">
    <div class="wrapper">
            <div class="card-switch">
                <label class="switch">
                   <input type="checkbox" class="toggle">
                   <span class="slider"></span>
                   <span class="card-side"></span>
                   <div class="flip-card__inner">
                      <div class="flip-card__front">
                         <div class="title-signup">Log in</div>
                         <form class="flip-card__form" action="">
                            <input class="flip-card__input" name="email" placeholder="Email" type="email">
                            <input class="flip-card__input" name="password" placeholder="Password" type="password">
                            <button class="flip-card__btn">Let`s go!</button>
                            <button type="button" class="flip-card__btn"><a class="nav-link2" href="Index.html" style="text-decoration:none; color:inherit;">Cancel</a></button>
                         </form>
                      </div>
                      
                      <div class="flip-card__back">
                         <div class="title-signup">Sign up</div>
                         <form class="flip-card__form" action="">
                            <input class="flip-card__input" placeholder="Name" type="text">
                            <input class="flip-card__input" name="email" placeholder="Email" type="email">
                            <input class="flip-card__input" name="password" placeholder="Password" type="password">
                            <button class="flip-card__btn">Confirm!</button>
                            <button type="button" class="flip-card__btn"><a class="nav-link2" href="Index.html" style="text-decoration:none; color:inherit;">Cancel</a></button>
                         </form>
                      </div>
                   </div>
                </label>
            </div>   
       </div>

  </div>
</section>
        

</body>
</html>
